[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scibowl-gpt"
version = "0.1.0"
description = "Science Bowl question generation pipeline with retrieval, verification, and evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "pandas>=2.2",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
embeddings = ["sentence-transformers>=5.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider", "-p", "no:tmpdir"]
