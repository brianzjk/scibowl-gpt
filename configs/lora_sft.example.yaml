model:
  model_name_or_path: Qwen/Qwen3.5-9B
  attn_implementation: sdpa
  trust_remote_code: false
  use_bf16: true
  use_fp16: false
  load_in_4bit: true
  gradient_checkpointing: true

adapter:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  train_path: ../data/processed/training/sft_v1/sft_examples_train_materialized.jsonl
  val_path: ../data/processed/training/sft_v1/sft_examples_val.jsonl
  max_length: 1024

training:
  output_dir: ../models/qwen35_9b_scibowl_sft_v1
  resume_from_checkpoint: null
  num_train_epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  weight_decay: 0.0
  warmup_ratio: 0.03
  warmup_steps: null
  logging_steps: 10
  save_strategy: steps
  save_steps: 100
  eval_strategy: steps
  eval_steps: 100
  save_total_limit: 2
  seed: 42
