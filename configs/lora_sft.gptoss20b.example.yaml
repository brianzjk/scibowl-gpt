model:
  model_name_or_path: openai/gpt-oss-20b
  attn_implementation: eager
  trust_remote_code: false
  use_bf16: true
  use_fp16: false
  load_in_4bit: false
  quantization: mxfp4
  mxfp4_dequantize: true
  gradient_checkpointing: true

adapter:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  bias: none
  target_modules: all-linear
  target_parameters:
    - 7.mlp.experts.gate_up_proj
    - 7.mlp.experts.down_proj
    - 15.mlp.experts.gate_up_proj
    - 15.mlp.experts.down_proj
    - 23.mlp.experts.gate_up_proj
    - 23.mlp.experts.down_proj

data:
  train_path: ../data/processed/training/sft_v1/sft_examples_train_materialized.jsonl
  val_path: ../data/processed/training/sft_v1/sft_examples_val.jsonl
  max_length: 2048

training:
  output_dir: ../models/gpt_oss_20b_scibowl_sft_v1
  resume_from_checkpoint: null
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  weight_decay: 0.0
  warmup_ratio: 0.03
  warmup_steps: null
  logging_steps: 10
  save_strategy: steps
  save_steps: 100
  eval_strategy: steps
  eval_steps: 100
  save_total_limit: 2
  seed: 42
