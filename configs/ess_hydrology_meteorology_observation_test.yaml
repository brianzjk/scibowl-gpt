output_path: data/processed/generated/ess_hydrology_meteorology_observation_test.jsonl
style_questions_path: data/interim/question_sets/style_corpus_all.jsonl
textbook_chunks_path: data/interim/textbooks
random_seed: 23

jobs:
  - job_id: ess_hydrology_test
    category: earth_space
    subcategory: Hydrology
    question_type: tossup
    answer_mode: short_answer
    difficulty: 4
    count: 3
    topic_focus:
      - groundwater
      - infiltration
      - watersheds

  - job_id: ess_meteorology_test
    category: earth_space
    subcategory: Meteorology
    question_type: tossup
    answer_mode: short_answer
    difficulty: 4
    count: 3
    topic_focus:
      - cold fronts
      - humidity
      - pressure gradients

  - job_id: ess_observation_test
    category: earth_space
    subcategory: Observation
    question_type: tossup
    answer_mode: short_answer
    difficulty: 4
    count: 3
    topic_focus:
      - equatorial coordinates
      - telescope mounts
      - photometry
